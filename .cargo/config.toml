# Dependency cooldown: skip crate versions published less than three days ago when resolving.
# Override a single update with `CARGO_RESOLVER_INCOMPATIBLE_PUBLISH_AGE=allow cargo update -p <crate>`.
[registry]
global-min-publish-age = "3 days"

# `target-cpu` is intentionally not set here so release binaries stay portable. For a local
# build tuned to the current machine, set it in your user-level `~/.cargo/config.toml`, e.g.:
#
#     [target.x86_64-pc-windows-msvc]
#     rustflags = ["-C", "target-cpu=x86-64-v3"]
