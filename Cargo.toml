[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
categories = ["computer-vision", "science"]
edition = "2024"
keywords = ["birefnet", "burn", "deep-learning", "segmentation"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/nusu-github/BiRefNet-Burn"
rust-version = "1.100"
version = "0.1.0"

[workspace.lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.cargo]
unused_dependencies = "warn"

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

allow_attributes = "warn"
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
literal_string_with_formatting_args = "allow"
map_err_ignore = "warn"
multiple_crate_versions = "allow"
redundant_clone = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
too_long_first_doc_paragraph = "warn"
undocumented_unsafe_blocks = "warn"
unneeded_field_pattern = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unused_result_ok = "warn"

[workspace.dependencies]
# Workspace crates
birefnet = { path = "crates/birefnet", version = "0.1.0" }
birefnet-backbones = { path = "crates/birefnet-backbones", version = "0.1.0" }
birefnet-extra-ops = { path = "crates/birefnet-extra-ops", version = "0.1.0" }
birefnet-inference = { path = "crates/birefnet-inference", version = "0.1.0" }
birefnet-loss = { path = "crates/birefnet-loss", version = "0.1.0" }
birefnet-metric = { path = "crates/birefnet-metric", version = "0.1.0" }
birefnet-model = { path = "crates/birefnet-model", version = "0.1.0" }
birefnet-train = { path = "crates/birefnet-train", version = "0.1.0" }
birefnet-util = { path = "crates/birefnet-util", version = "0.1.0" }
birefnet-weights = { path = "crates/birefnet-weights", version = "0.1.0" }

# Burn framework (each library member enables only the API features it needs)
burn = { version = "=0.22.1", default-features = false, features = ["std"] }

# Error handling
anyhow = { version = "1.0.104", default-features = false, features = ["std"] }

# CLI
clap = { version = "4.6.8", default-features = false, features = ["std"] }

# Image processing
image = { version = "0.25.10", default-features = false }

# Utilities
approx = "0.5.1"
libm = "0.2.16"
mimalloc = { version = "0.1.52", default-features = false }
rand = "0.10.4"
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
stacker = "0.1.25"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std"] }

# Model hub integration
hf-hub = { version = "1.0.0", default-features = false }

# Testing
tempfile = "3.27.0"

# Unit tests run real tensor kernels on Flex; optimize dependencies in dev/test while
# keeping proc-macros and workspace crates fast to compile and debug.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.image]
opt-level = 3

[profile.dev.build-override]
opt-level = 1
