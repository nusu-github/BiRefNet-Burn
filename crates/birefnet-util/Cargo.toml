[package]
name = "birefnet-util"
version.workspace = true
categories.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
description = "Tensor, morphological, distance-transform, filtering, and optional image I/O utilities for BiRefNet"

[features]
default = []
image-io = ["dep:image"]

[dependencies]
burn = { workspace = true }
image = { workspace = true, optional = true, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }

[dev-dependencies]
approx = { workspace = true }
burn = { workspace = true, features = ["flex"] }
tempfile = { workspace = true }

[lints]
workspace = true
