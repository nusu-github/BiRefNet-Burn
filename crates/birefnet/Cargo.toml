[package]
name = "birefnet"
description = "BiRefNet: Bilateral Reference Network for high-resolution dichotomous image segmentation"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
version.workspace = true

[[bin]]
name = "birefnet"
path = "src/bin/birefnet.rs"

[features]
default = ["inference", "flex", "fusion"]

# Backends. Burn 0.22 selects the backend at run time from a `Device` value, so several
# backends can be compiled in at once; `--device` picks one. Library crates never enable
# a backend: this binary is the only place where these choices are made.
flex = ["burn/flex", "burn/simd", "burn/rayon"]
cpu = ["burn/cpu"]
wgpu = ["burn/wgpu"]
vulkan = ["wgpu", "burn/vulkan"]
metal = ["wgpu", "burn/metal"]
cuda = ["burn/cuda"]
rocm = ["burn/rocm"]

# Kernel fusion and autotuning for the CubeCL backends (cpu, wgpu, vulkan, metal, cuda, rocm).
# Spelled out here instead of relying on `burn`'s default features to switch them on.
fusion = ["burn/fusion", "burn/autotune"]

# Tasks
inference = ["dep:birefnet-inference"]
train = [
    "burn/train",
    "burn/tui",
    "burn/metrics",
    "birefnet-model/train",
    "dep:birefnet-train",
    "dep:birefnet-loss",
    "dep:birefnet-metric",
]

[dependencies]
# Core BiRefNet crates
birefnet-inference = { path = "../birefnet-inference", version = "0.1.0", optional = true }
birefnet-loss = { path = "../birefnet-loss", version = "0.1.0", optional = true }
birefnet-metric = { path = "../birefnet-metric", version = "0.1.0", optional = true }
birefnet-model = { path = "../birefnet-model", version = "0.1.0" }
birefnet-train = { path = "../birefnet-train", version = "0.1.0", optional = true }
birefnet-util = { path = "../birefnet-util", version = "0.1.0" }

# CLI dependencies
anyhow = { workspace = true }
burn = { workspace = true }
clap = { workspace = true }
stacker = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
