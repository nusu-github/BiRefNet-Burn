[package]
name = "birefnet"
version.workspace = true
categories.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
description = "BiRefNet: Bilateral Reference Network for high-resolution dichotomous image segmentation"

[features]
default = ["inference", "hub"]

# High-level subsystems
weights = ["dep:birefnet-weights"]
hub = ["weights", "birefnet-weights/hub"]
inference = ["weights", "dep:birefnet-inference", "birefnet-util/image-io"]
train = [
    "burn/train",
    "burn/tui",
    "burn/metrics",
    "birefnet-model/train",
    "dep:birefnet-train",
    "dep:birefnet-loss",
    "dep:birefnet-metric",
]

# Backends. Burn 0.22 selects the backend at run time from a `Device` value; Cargo features
# control which backends are compiled into a downstream binary or test target.
flex = ["burn/flex", "burn/simd", "burn/rayon"]
cpu = ["burn/cpu"]
wgpu = ["burn/wgpu"]
vulkan = ["wgpu", "burn/vulkan"]
metal = ["wgpu", "burn/metal"]
cuda = ["burn/cuda"]
rocm = ["burn/rocm"]
fusion = ["burn/fusion", "burn/autotune"]

[dependencies]
birefnet-inference = { workspace = true, optional = true }
birefnet-loss = { workspace = true, optional = true }
birefnet-metric = { workspace = true, optional = true }
birefnet-model.workspace = true
birefnet-train = { workspace = true, optional = true }
birefnet-util.workspace = true
birefnet-weights = { workspace = true, optional = true }
burn.workspace = true

[lints]
workspace = true
