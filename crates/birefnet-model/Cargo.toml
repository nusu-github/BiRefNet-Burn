[package]
name = "birefnet-model"
version.workspace = true
categories.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
description = "Rust implementation of BiRefNet for high-resolution dichotomous image segmentation using Burn"

[features]
# Training integration (`TrainStep`/`InferenceStep`, loss and segmentation metric adaptors).
train = ["burn/train", "dep:birefnet-loss", "dep:birefnet-metric", "birefnet-metric/train"]

[dependencies]
birefnet-backbones.workspace = true
birefnet-loss = { workspace = true, optional = true }
birefnet-metric = { workspace = true, optional = true }
burn.workspace = true

[dev-dependencies]
burn = { workspace = true, features = ["flex"] }

[lints]
workspace = true
