[package]
name = "birefnet-cli"
version.workspace = true
categories = ["command-line-utilities", "computer-vision"]
edition.workspace = true
keywords.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
description = "Command-line interface for BiRefNet inference and training."

[[bin]]
name = "birefnet"
path = "src/main.rs"
# The binary shares its name with the `birefnet` library crate; documenting both collides.
doc = false

[features]
# `fusion` (kernel fusion + autotune) only affects CubeCL backends (`cpu`, `wgpu`, `vulkan`,
# `metal`, `cuda`, `rocm`). It is on by default so GPU builds do not silently lose it; use
# `--no-default-features --features <backend>` for an unfused comparison build.
default = ["flex", "hub", "fusion"]
hub = ["birefnet/hub"]
train = ["birefnet/train", "burn/train", "dep:serde_json"]
flex = ["birefnet/flex"]
cpu = ["birefnet/cpu"]
wgpu = ["birefnet/wgpu"]
vulkan = ["birefnet/vulkan"]
metal = ["birefnet/metal"]
cuda = ["birefnet/cuda"]
rocm = ["birefnet/rocm"]
fusion = ["birefnet/fusion"]

[dependencies]
anyhow.workspace = true
birefnet = { workspace = true, default-features = false, features = ["inference"] }
burn = { workspace = true, features = ["extension"] }
clap = { workspace = true, features = ["derive", "help", "usage", "error-context"] }
mimalloc.workspace = true
serde_json = { workspace = true, optional = true }
stacker.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter", "ansi"] }

[lints]
workspace = true
